[project]
name = "osrs-ml"
version = "0.1.0"
description = "Shared, execution-aware research harness for the existing OSRS pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
  "catboost>=1.2.8,<2",
  "duckdb>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=20,<24",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
osrs-ml = "osrs_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
